<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne — AFYA APP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #faf8f5;
            color: #3d3833;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* ── Cercles décoratifs flottants en arrière-plan ── */
        .blob {
            position: fixed;
            border-radius: 50%;
            background: #f3e7dc;
            z-index: 0;
            animation: float 7s ease-in-out infinite;
        }
        .blob.b1 { width: 14rem; height: 14rem; top: -4rem; left: -4rem; }
        .blob.b2 { width: 9rem;  height: 9rem;  bottom: -3rem; right: -2rem; animation-delay: 2s; }
        .blob.b3 { width: 5rem;  height: 5rem;  top: 15%; right: 8%; animation-delay: 4s; background: #f9efe6; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border: 1px solid #ece7e0;
            border-radius: 1.25rem;
            box-shadow: 0 10px 40px rgba(61, 56, 51, 0.08);
            padding: 2rem 2.5rem 2.5rem;
            max-width: 26rem;
            width: 100%;
            text-align: center;
            animation: rise 0.6s ease-out both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Illustration avec flottement doux ── */
        .illus {
            width: 13rem;
            max-width: 70%;
            margin: 0 auto 0.5rem;
            display: block;
            animation: float 5s ease-in-out infinite;
            animation-delay: 0.3s;
        }

        h1 {
            font-size: 1.5rem; font-weight: 700;
            margin-bottom: 0.75rem; color: #2e2a26;
            animation: rise 0.6s ease-out 0.15s both;
        }
        p {
            color: #7d756c; line-height: 1.6;
            margin-bottom: 1.5rem; font-size: 0.95rem;
            animation: rise 0.6s ease-out 0.25s both;
        }

        /* ── Ligne ECG animée (battement de cœur) ── */
        .ecg { width: 11rem; margin: 0 auto 1.5rem; display: block; animation: rise 0.6s ease-out 0.35s both; }
        .ecg path {
            stroke: #c2703e;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 340;
            stroke-dashoffset: 340;
            animation: heartbeat 2.2s linear infinite;
        }
        @keyframes heartbeat {
            0%   { stroke-dashoffset: 340; opacity: 1; }
            70%  { stroke-dashoffset: 0;   opacity: 1; }
            100% { stroke-dashoffset: 0;   opacity: 0; }
        }

        .btn {
            display: inline-block;
            background: #c2703e;
            color: #fff;
            border: none;
            border-radius: 0.65rem;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            animation: rise 0.6s ease-out 0.45s both;
        }
        .btn:hover { background: #a85f33; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        .auto {
            margin-top: 1.25rem; font-size: 0.8rem; color: #a89f94;
            animation: rise 0.6s ease-out 0.55s both;
        }
        #dot {
            display: inline-block; width: 0.6rem; height: 0.6rem;
            border-radius: 50%; background: #d97b6c;
            margin-right: 0.4rem; vertical-align: middle;
            animation: blink 1.4s ease-in-out infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        #dot.online { background: #6f9f7a; animation: none; }

        .brand {
            margin-top: 2rem; font-size: 0.75rem;
            letter-spacing: 0.15em; color: #c4bab0; text-transform: uppercase;
            animation: rise 0.6s ease-out 0.65s both;
        }
    </style>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="card">
        <img class="illus" src="/static/img/offline-illustration.png" alt="Équipe médicale AFYA">

        <h1>Connexion perdue</h1>

        <svg class="ecg" viewBox="0 0 200 60">
            <path d="M0 30 H55 L70 30 L80 8 L95 52 L105 18 L112 30 H145 L152 24 L160 30 H200"/>
        </svg>

        <p>AFYA APP n'arrive pas à joindre le serveur.<br>
        Vérifie ta connexion internet (ou que le serveur est bien démarré), puis réessaie.</p>

        <button class="btn" onclick="window.location.reload()">Réessayer</button>

        <div class="auto">
            <span id="dot"></span><span id="status">Hors ligne — nouvelle tentative automatique dans <b id="count">10</b> s…</span>
        </div>

        <div class="brand">AFYA APP — CRF-MK Kinshasa</div>
    </div>

    <script>
        // Rechargement automatique dès que la connexion revient
        window.addEventListener('online', function () {
            document.getElementById('dot').classList.add('online');
            document.getElementById('status').textContent = 'Connexion rétablie — rechargement…';
            setTimeout(function () { window.location.reload(); }, 600);
        });
        // Compte à rebours + nouvelle tentative toutes les 10 s
        var n = 10, el = document.getElementById('count');
        setInterval(function () {
            n--;
            if (n <= 0) { window.location.reload(); return; }
            el.textContent = n;
        }, 1000);
    </script>
</body>
</html>
