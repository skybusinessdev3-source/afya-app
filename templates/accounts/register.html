{% extends 'base.html' %}
{% block title %}Créer un compte — CRF-MK{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-100 dark:from-gray-950 dark:via-gray-900 dark:to-indigo-950/30 px-4">
    <div class="w-full max-w-md bg-white dark:bg-gray-900/90 rounded-3xl shadow-2xl p-8 animate-pop-in border border-indigo-100 dark:border-gray-800">
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-xl animate-floatY">
                <i data-lucide="user-plus" class="w-8 h-8"></i>
            </div>
            <h2 class="mt-3 text-xl font-extrabold text-indigo-700 dark:text-indigo-400">Créer un compte</h2>
            <p class="text-sm text-gray-400">Un code d'invitation du directeur est requis</p>
        </div>

        <form method="post" action="{% url 'accounts:register_submit' %}" class="space-y-3">
            {% csrf_token %}
            <input type="text" name="code" placeholder="Code d'invitation *" required
                   class="w-full px-4 py-3 rounded-xl border-2 border-indigo-200 dark:border-indigo-900 bg-white dark:bg-gray-800 text-sm font-mono tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" name="last_name" placeholder="Nom" class="px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                <input type="text" name="first_name" placeholder="Prénom" class="px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <input type="text" name="username" placeholder="Nom d'utilisateur *" required
                   class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <input type="password" name="password" placeholder="Mot de passe (8 caractères min) *" required
                   class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <button type="submit"
                    class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold shadow-lg shadow-indigo-600/30 active:scale-[.98]">
                Créer mon compte
            </button>
        </form>

        <p class="mt-5 text-center text-sm text-gray-400">
            Déjà un compte ? <a href="{% url 'login' %}" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
