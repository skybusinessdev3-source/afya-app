{% extends 'base.html' %}
{% block page_title %}Rendez-vous{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

    <!-- ===== Calendrier ===== -->
    <div class="lg:col-span-2">
        <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 animate-fade-up">
            <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 flex-wrap gap-2">
                <div class="flex items-center gap-2">
                    <button onclick="changePeriod(-1)" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button onclick="changePeriod(1)" class="w-10 h-10 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                    <h3 id="cal-title" class="font-bold text-lg capitalize ml-2"></h3>
                </div>
                <!-- Bascule Mois / Semaine -->
                <div class="flex rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden text-sm">
                    <button id="view-month-btn" onclick="setView('month')" class="px-4 py-2 font-semibold bg-brand-600 text-white">Mois</button>
                    <button id="view-week-btn" onclick="setView('week')" class="px-4 py-2 font-semibold text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800">Semaine</button>
                </div>
            </div>
            <div class="p-4">
                <!-- En-têtes jour (vue mois) -->
                <div id="month-header" class="grid grid-cols-7 text-center text-xs font-semibold text-gray-400 mb-2">
                    <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
                </div>
                <!-- Vue mois -->
                <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>

                <!-- Vue semaine (masquée par défaut) -->
                <div id="week-view" class="hidden">
                    <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-gray-400 mb-2">
                        <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
                    </div>
                    <div id="week-grid" class="grid grid-cols-7 gap-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Jour sélectionné + nouveau RDV ===== -->
    <div class="space-y-4">
        <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 animate-fade-up" style="animation-delay:.1s">
            <div class="p-4 border-b border-gray-200 dark:border-gray-800">
                <h3 class="font-bold flex items-center gap-2">
                    <i data-lucide="calendar-clock" class="w-5 h-5 text-brand-600"></i>
                    <span id="day-title">Sélectionnez un jour</span>
                </h3>
            </div>
            <div id="day-list" class="divide-y divide-gray-100 dark:divide-gray-800 max-h-56 overflow-y-auto">
                <p class="p-4 text-sm text-gray-400 text-center">Cliquez sur une date du calendrier.</p>
            </div>
        </div>

        <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 border border-brand-300 dark:border-brand-800 animate-fade-up" style="animation-delay:.2s">
            <h3 class="font-bold mb-3 flex items-center gap-2">
                <i data-lucide="calendar-plus" class="w-5 h-5 text-brand-600"></i> Nouveau rendez-vous
            </h3>
            <div class="space-y-2">
                <div>
                    <input id="a-patient-search" type="text" placeholder="Rechercher le patient…"
                           class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm" autocomplete="off">
                    <div id="a-patient-results" class="mt-2 space-y-1"></div>
                    <div id="a-patient-selected" class="hidden mt-2 flex items-center justify-between px-3 py-2.5 rounded-xl bg-brand-50 dark:bg-brand-950 border border-brand-300 dark:border-brand-800 text-sm">
                        <span class="font-semibold text-brand-700 dark:text-brand-300" id="a-patient-name"></span>
                        <button onclick="clearApptPatient()" class="text-gray-400 hover:text-red-500 text-xs font-medium">Changer</button>
                    </div>
                </div>
                <input id="a-datetime" type="datetime-local" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
                <input id="a-motif" type="text" placeholder="Motif du rendez-vous *"
                       class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
                <select id="a-doctor" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
                    <option value="">— Médecin (Dr. Directeur par défaut) —</option>
                    {% for d in doctors %}<option value="{{ d.id }}">{{ d }}</option>{% endfor %}
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <select id="a-remind" class="px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
                        <option value="0">Rappel : le jour J</option>
                        <option value="1" selected>Rappel : 1 jour avant</option>
                        <option value="2">Rappel : 2 jours avant</option>
                        <option value="7">Rappel : 7 jours avant</option>
                    </select>
                    <label class="flex items-center gap-2 px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 text-sm cursor-pointer">
                        <input id="a-alarm" type="checkbox" checked class="accent-brand-600"> Alarme
                    </label>
                </div>
                <div id="a-feedback" class="hidden px-3 py-2.5 rounded-xl text-sm font-medium"></div>
                <button onclick="submitAppointment(this)"
                        class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-500 to-brand-700 text-white font-semibold active:scale-[.98]">
                    Créer le rendez-vous
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let calYear, calMonth, selectedDate = null, apptPatient = null, aTimer;
let currentView = 'month', weekStart = null, monthData = {};
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

/* ================= VUES ================= */
function setView(view) {
    currentView = view;
    const mb = document.getElementById('view-month-btn');
    const wb = document.getElementById('view-week-btn');
    const active = ['bg-brand-600', 'text-white'];
    const inactive = ['text-gray-500', 'dark:text-gray-400', 'hover:bg-gray-100', 'dark:hover:bg-gray-800'];
    if (view === 'month') {
        mb.classList.add(...active); mb.classList.remove(...inactive);
        wb.classList.remove(...active); wb.classList.add(...inactive);
        document.getElementById('cal-grid').classList.remove('hidden');
        document.getElementById('month-header').classList.remove('hidden');
        document.getElementById('week-view').classList.add('hidden');
        renderCalendar();
    } else {
        wb.classList.add(...active); wb.classList.remove(...inactive);
        mb.classList.remove(...active); mb.classList.add(...inactive);
        document.getElementById('cal-grid').classList.add('hidden');
        document.getElementById('month-header').classList.add('hidden');
        document.getElementById('week-view').classList.remove('hidden');
        if (!weekStart) weekStart = mondayOf(new Date());
        renderWeek();
    }
}

function mondayOf(date) {
    const d = new Date(date);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    d.setHours(0, 0, 0, 0);
    return d;
}

function changePeriod(delta) {
    if (currentView === 'month') {
        calMonth += delta;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
    } else {
        weekStart.setDate(weekStart.getDate() + 7 * delta);
        renderWeek();
    }
}

/* ================= VUE MOIS ================= */
async function renderCalendar() {
    document.getElementById('cal-title').textContent = `${MOIS[calMonth]} ${calYear}`;
    const res = await fetch(`{% url 'appointments:month' %}?mois=${calYear}-${String(calMonth + 1).padStart(2, '0')}`);
    monthData = (await res.json()).days;

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    const firstDay = new Date(calYear, calMonth, 1);
    const startIdx = (firstDay.getDay() + 6) % 7; // lundi = 0
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);

    for (let i = 0; i < startIdx; i++) grid.insertAdjacentHTML('beforeend', '<div></div>');

    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const count = (monthData[dateStr] || []).length;
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        grid.insertAdjacentHTML('beforeend', `
            <button onclick="selectDay('${dateStr}')"
                    class="relative aspect-square rounded-xl text-sm flex flex-col items-center justify-center transition
                           ${isSelected ? 'bg-brand-600 text-white font-bold shadow-lg shadow-brand-600/40' :
                             isToday ? 'border-2 border-brand-500 font-bold text-brand-600 dark:text-brand-400' :
                             'hover:bg-brand-50 dark:hover:bg-brand-950/40 border border-gray-100 dark:border-gray-800'}">
                <span>${d}</span>
                ${count ? `<span class="absolute bottom-1 w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-brand-500'}"></span>` : ''}
            </button>`);
    }
}

/* ================= VUE SEMAINE ================= */
async function renderWeek() {
    const months = new Set();
    for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }
    const allDays = {};
    for (const m of months) {
        const res = await fetch(`{% url 'appointments:month' %}?mois=${m}`);
        Object.assign(allDays, (await res.json()).days);
    }

    const end = new Date(weekStart); end.setDate(end.getDate() + 6);
    document.getElementById('cal-title').textContent = weekStart.getMonth() === end.getMonth()
        ? `${weekStart.getDate()} – ${end.getDate()} ${MOIS[weekStart.getMonth()]} ${weekStart.getFullYear()}`
        : `${weekStart.getDate()} ${MOIS[weekStart.getMonth()].slice(0, 3)} – ${end.getDate()} ${MOIS[end.getMonth()].slice(0, 3)} ${end.getFullYear()}`;

    const todayStr = new Date().toISOString().slice(0, 10);
    const grid = document.getElementById('week-grid');
    grid.innerHTML = '';

    for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().slice(0, 10);
        const appts = allDays[dateStr] || [];
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;

        grid.insertAdjacentHTML('beforeend', `
            <div class="min-h-[7rem] rounded-xl border p-1.5 flex flex-col gap-1 cursor-pointer transition
                        ${isSelected ? 'border-brand-600 bg-brand-50 dark:bg-brand-950/40' : isToday ? 'border-brand-500' : 'border-gray-100 dark:border-gray-800'}
                        hover:bg-brand-50 dark:hover:bg-brand-950/30"
                 onclick="selectDay('${dateStr}')">
                <div class="text-xs font-bold ${isToday || isSelected ? 'text-brand-600 dark:text-brand-400' : 'text-gray-400'}">${d.getDate()}</div>
                ${appts.map(a => `
                    <div class="px-1.5 py-1 rounded-md bg-brand-100 dark:bg-brand-950 text-[10px] leading-tight">
                        <b>${a.time}</b> ${a.patient.split(' ')[0]}
                    </div>`).join('')}
            </div>`);
    }
}

/* ================= SÉLECTION JOUR ================= */
async function selectDay(dateStr) {
    selectedDate = dateStr;
    if (currentView === 'month') renderCalendar(); else renderWeek();

    const [y, m, d] = dateStr.split('-');
    document.getElementById('day-title').textContent = `${parseInt(d)} ${MOIS[parseInt(m) - 1]} ${y}`;
    document.getElementById('a-datetime').value = `${dateStr}T08:00`;

    // Recharge les RDV du jour selon la vue courante
    const res = await fetch(`{% url 'appointments:month' %}?mois=${y}-${m}`);
    const days = (await res.json()).days;

    const list = document.getElementById('day-list');
    const appts = days[dateStr] || [];
    list.innerHTML = appts.length
        ? appts.map(a => `
            <div class="px-4 py-3 flex items-center justify-between gap-2 text-sm">
                <div>
                    <p class="font-semibold">${a.time} — ${a.patient}</p>
                    <p class="text-xs text-gray-400">${a.doctor} · ${a.motif}</p>
                </div>
                <button onclick="cancelAppt(${a.id}, this)" title="Annuler"
                        class="w-8 h-8 rounded-lg text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center justify-center">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>`).join('')
        : `<p class="p-4 text-sm text-gray-400 text-center">Aucun rendez-vous ce jour.</p>`;
    lucide.createIcons();
}

async function cancelAppt(id, btn) {
    btn.disabled = true;
    const res = await fetch(`/rendez-vous/api/annuler/${id}/`, {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
    });
    const data = await res.json();
    if (data.success) {
        if (currentView === 'month') renderCalendar(); else renderWeek();
        if (selectedDate) selectDay(selectedDate);
    }
}

/* ================= RECHERCHE PATIENT ================= */
const aInput = document.getElementById('a-patient-search');
const aBox = document.getElementById('a-patient-results');
aInput.addEventListener('input', () => {
    clearTimeout(aTimer);
    const q = aInput.value.trim();
    if (q.length < 2) { aBox.innerHTML = ''; return; }
    aTimer = setTimeout(async () => {
        const res = await fetch(`/centre/api/recherche-patients/?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        aBox.innerHTML = data.results.length
            ? data.results.map(p => `
                <button onclick='selectApptPatient(${JSON.stringify(p)})'
                        class="w-full text-left px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-brand-500 hover:bg-brand-50 dark:hover:bg-brand-950/40 transition text-sm">
                    <span class="font-semibold">${p.name}</span>
                    <span class="text-xs text-gray-400"> — ${p.phone}</span>
                </button>`).join('')
            : `<p class="px-3 py-2 text-xs text-red-500">Patient introuvable — créez-le via la page Centre.</p>`;
    }, 250);
});

function selectApptPatient(p) {
    apptPatient = p;
    aBox.innerHTML = '';
    aInput.classList.add('hidden');
    document.getElementById('a-patient-name').textContent = p.name;
    document.getElementById('a-patient-selected').classList.remove('hidden');
}
function clearApptPatient() {
    apptPatient = null;
    aInput.classList.remove('hidden');
    aInput.value = '';
    document.getElementById('a-patient-selected').classList.add('hidden');
}

/* ================= CRÉATION ================= */
async function submitAppointment(btn) {
    const feedback = document.getElementById('a-feedback');
    btn.disabled = true;

    if (!apptPatient) {
        showFb(feedback, false, 'Sélectionnez d\'abord un patient.');
        btn.disabled = false;
        return;
    }
    const motif = document.getElementById('a-motif').value.trim();
    if (!motif) {
        showFb(feedback, false, 'Le motif est obligatoire.');
        btn.disabled = false;
        return;
    }

    const payload = {
        patient_id: apptPatient.id,
        datetime: document.getElementById('a-datetime').value,
        motif,
        doctor_id: document.getElementById('a-doctor').value || null,
        remind_days_before: document.getElementById('a-remind').value,
        alarm: document.getElementById('a-alarm').checked,
    };

    const res = await fetch("{% url 'appointments:create' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify(payload),
    });
    const data = await res.json();
    showFb(feedback, data.success, (data.success ? '✓ ' : '✗ ') + data.message);
    if (data.success && selectedDate) {
        setTimeout(() => {
            if (currentView === 'month') renderCalendar(); else renderWeek();
            selectDay(selectedDate);
        }, 800);
    }
    btn.disabled = false;
}

function showFb(el, ok, msg) {
    el.classList.remove('hidden',
        'bg-red-100', 'dark:bg-red-950', 'text-red-700', 'dark:text-red-300',
        'bg-brand-100', 'dark:bg-brand-950', 'text-brand-700', 'dark:text-brand-300');
    el.classList.add(ok ? 'bg-brand-100' : 'bg-red-100', ok ? 'dark:bg-brand-950' : 'dark:bg-red-950',
                     ok ? 'text-brand-700' : 'text-red-700', ok ? 'dark:text-brand-300' : 'dark:text-red-300');
    el.textContent = msg;
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie) {
        document.cookie.split(';').forEach(c => {
            const [k, v] = c.trim().split('=');
            if (k === name) cookieValue = decodeURIComponent(v);
        });
    }
    return cookieValue;
}

/* ================= INIT ================= */
function initCalendar() {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    renderCalendar();
}
initCalendar();
</script>
{% endblock %}
